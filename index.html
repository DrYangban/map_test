<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울 CCTV 위치 지도</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#192337}header{padding:13px 18px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #ddd}h1{font-size:20px;margin:0}small{color:#526075}#tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select{padding:8px;border:1px solid #aaa;border-radius:6px;background:white;max-width:210px}#map{height:calc(100dvh - 111px);min-height:420px}footer{padding:9px 16px;font-size:12px;color:#526075} .dot{width:11px;height:11px;display:inline-block;border-radius:50%;background:#2673db;margin-right:5px}.leaflet-popup-content{line-height:1.6;min-width:190px}.cluster{background:#1866bd;border:3px solid #fff;border-radius:50%;color:white;text-align:center;font-weight:700;box-shadow:0 1px 6px #0005;display:flex;align-items:center;justify-content:center}.err{color:#b91c1c}</style></head><body><header><div><h1>서울 CCTV 위치 지도</h1><small>서울시 공공데이터 · 개별 행 기준 위치 표시</small></div><div id="tools"><label for="purpose">설치 목적</label><select id="purpose"><option value="">전체 보기</option></select><span id="status" aria-live="polite">데이터를 불러오는 중…</span></div></header><div id="map" role="application" aria-label="서울 CCTV 지도"></div><footer>지도 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap 기여자</a> · 자료: 서울특별시 CCTV 공공데이터 (기준일: <span id="date">확인 중</span>) · 위치와 설치 현황은 원자료 기준이며 실제 현황과 다를 수 있습니다.</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/supercluster@8.0.1/dist/supercluster.min.js"></script><script>
const map=L.map('map',{preferCanvas:true}).setView([37.5665,126.978],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const layer=L.layerGroup().addTo(map),select=document.querySelector('#purpose'),status=document.querySelector('#status');
let rows=[],index=null,renderTimer;
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function build(){const purpose=select.value;const points=[];for(let i=0;i<rows.length;i++){const r=rows[i];if(purpose&&r[2]!==purpose)continue;points.push({type:'Feature',geometry:{type:'Point',coordinates:[r[1],r[0]]},properties:{i}})}index=new Supercluster({radius:55,maxZoom:17,minPoints:3}).load(points);draw();}
function draw(){if(!index)return;layer.clearLayers();const b=map.getBounds(),z=Math.min(19,Math.max(0,Math.floor(map.getZoom())));const clusters=index.getClusters([b.getWest(),b.getSouth(),b.getEast(),b.getNorth()],z);let count=0;for(const f of clusters){if(count++>3500)break;const [lng,lat]=f.geometry.coordinates,p=f.properties;if(p.cluster){const n=p.point_count;const size=n>1000?48:n>100?42:36;const marker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:`<div class="cluster" style="width:${size}px;height:${size}px">${n.toLocaleString('ko-KR')}</div>`,iconSize:[size,size]})});marker.on('click',()=>map.flyTo([lat,lng],Math.min(index.getClusterExpansionZoom(p.cluster_id),18)));layer.addLayer(marker)}else{const r=rows[p.i];const m=L.circleMarker([lat,lng],{radius:5,weight:1,color:'#fff',fillColor:'#2376d8',fillOpacity:.85});m.bindPopup(`<strong>${safe(r[2]||'CCTV')}</strong><div>주소: ${safe(r[4]||'미기재')}</div><div>카메라 대수: ${safe(r[3]??'미기재')}</div><div>관리기관: ${safe(r[5]||'미기재')}</div>`);layer.addLayer(m)}}status.textContent=`${(select.value?rows.filter(r=>r[2]===select.value).length:rows.length).toLocaleString('ko-KR')}건 · 화면 ${Math.min(clusters.length,3501).toLocaleString('ko-KR')}개 표시${clusters.length>3501?' (확대해 주세요)':''}`;}
map.on('moveend',()=>{clearTimeout(renderTimer);renderTimer=setTimeout(draw,80)});select.addEventListener('change',build);
fetch('./cctv-data.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{rows=data.rows;document.querySelector('#date').textContent=data.date||'미상';for(const p of [...new Set(rows.map(r=>r[2]).filter(Boolean))].sort()){const o=document.createElement('option');o.value=p;o.textContent=p;select.append(o)}build()}).catch(e=>{status.className='err';status.textContent='데이터를 불러오지 못했습니다: '+e.message});
</script></body></html>
